<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/start.css')}}">
    <title>Quiz - Start Page</title>
</head>
<body>
    <h2>Choose a quiz</h2>
    <form action="/" method="post">
        <!-- Pilihan quiz  -->
        <select name="quiz">
            {% for id, name in quiz_list %} <!-- Jinja Feature -->
            <option value="{{ id }}">{{name}}</option>
            {% endfor %}
        </select>

        <!-- Tombol Submit -->
            <p>
                <input type="submit" value="Mulai lah masa engga">
            </p>
    </form>
</body>
</html>
