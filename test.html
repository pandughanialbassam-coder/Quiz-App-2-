<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/start.css')}}">
    <title>Quiz - Test Page </title>
</head>
<body>
    <!-- Question Start -->
    {% if question %}
    <h1>{{ question }}</h1>
    {% endif %}
    <!-- Question End -->


    <!-- Option Start -->
    <form action="test" method="post">
        <!-- simpan id question, tapi jangan tampilkan -->
        <input type="hidden" name="q_id" value="{{quest_id}}">

        <div>
            <!-- multiple choice -->
                {% for answer in answers_list %}
            <div>
                <input type="radio" name="ans_text" value="{{ answer}}">{{ answer }}
            </div>
            {% endfor %}
        </div>

        <!-- Tombol -->
        <div>
            <input type="submit" value="Send Answer">
        </div>
    </form>

    <!-- Option End -->
</body>
</html>
